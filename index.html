<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<title>Budget Planer</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}

:root {
  --bg: #F5F4F0;
  --bg2: #ECEAE4;
  --surface: #FFFFFF;
  --surface2: #F5F4F0;
  --surface3: #ECEAE4;
  --border: rgba(0,0,0,0.07);
  --border2: rgba(0,0,0,0.13);
  --text: #18181A;
  --text2: #6B6B72;
  --text3: #A8A8B0;
  --accent: #5B4FE8;
  --accent-light: #EEF0FF;
  --accent-text: #3D35C0;
  --green: #18A86B;
  --green-bg: #E8F8F2;
  --green-text: #0D6E46;
  --red: #E54545;
  --red-bg: #FEECEC;
  --red-text: #B02020;
  --amber: #D97706;
  --amber-bg: #FEF3E2;
  --amber-text: #92510A;
  --radius: 18px;
  --radius-sm: 12px;
  --radius-xs: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.08), 0 8px 32px rgba(0,0,0,0.06);
}

body {
  font-family: 'Instrument Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.app { max-width: 430px; margin: 0 auto; }

/* HEADER */
.header {
  background: rgba(245,244,240,0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 52px 20px 0;
  position: sticky; top: 0; z-index: 50;
  border-bottom: 1px solid var(--border);
}
.header-inner {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 14px;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 36px; height: 36px; border-radius: 11px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
  box-shadow: 0 2px 8px rgba(91,79,232,0.3);
}
.logo-text {
  font-family: 'Syne', sans-serif;
  font-size: 20px; font-weight: 800;
  letter-spacing: -0.5px; color: var(--text);
}
.month-nav { display: flex; align-items: center; gap: 4px; }
.month-btn {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid var(--border2);
  background: var(--surface);
  font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text2); box-shadow: var(--shadow);
  transition: all 0.15s;
}
.month-btn:active { background: var(--surface3); transform: scale(0.9); }
.month-label {
  font-family: 'Syne', sans-serif;
  font-size: 13px; font-weight: 700;
  min-width: 110px; text-align: center;
  color: var(--text2); letter-spacing: 0.01em;
}

/* TABS */
.tab-bar {
  display: flex; gap: 4px; padding: 10px 20px;
  background: rgba(245,244,240,0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: sticky; top: 89px; z-index: 49;
  border-bottom: 1px solid var(--border);
}
.tab {
  flex: 1; padding: 9px 4px; text-align: center;
  font-family: 'Syne', sans-serif;
  font-size: 12px; font-weight: 700;
  letter-spacing: 0.04em;
  cursor: pointer; color: var(--text3);
  border-radius: var(--radius-xs);
  transition: all 0.2s; user-select: none;
  border: 1px solid transparent;
}
.tab.active {
  color: var(--accent-text);
  background: var(--accent-light);
  border-color: rgba(91,79,232,0.15);
}

/* PAGES */
.page { display: none; padding: 16px 16px 110px; }
.page.active { display: block; }

/* SECTION TITLES */
.section-title {
  font-family: 'Syne', sans-serif;
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--text3); margin: 22px 4px 9px;
}
.section-title:first-child { margin-top: 2px; }
.section-row {
  display: flex; align-items: center; justify-content: space-between;
  margin: 22px 4px 9px;
}
.section-row .section-title { margin: 0; }

/* CARDS */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

/* METRIC GRID */
.metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.metric {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 15px 16px;
  box-shadow: var(--shadow);
}
.metric.accent-card {
  background: var(--accent);
  border-color: transparent;
  box-shadow: 0 4px 20px rgba(91,79,232,0.25);
}
.metric.accent-card .metric-label { color: rgba(255,255,255,0.65); }
.metric.accent-card .metric-value { color: #fff; }
.metric-label {
  font-family: 'Syne', sans-serif;
  font-size: 10px; font-weight: 700;
  color: var(--text3); text-transform: uppercase;
  letter-spacing: 0.07em; margin-bottom: 6px;
}
.metric-value {
  font-family: 'Syne', sans-serif;
  font-size: 21px; font-weight: 800;
  letter-spacing: -0.8px; line-height: 1;
  color: var(--text);
}
.metric-value.green { color: var(--green); }
.metric-value.red { color: var(--red); }
.metric-value.amber { color: var(--amber); }

/* PROGRESS */
.progress-row { margin-bottom: 15px; }
.progress-row:last-child { margin-bottom: 0; }
.progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
.progress-left { display: flex; align-items: center; gap: 7px; }
.progress-emoji {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--surface2);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
}
.progress-name { font-size: 14px; font-weight: 500; }
.progress-right { display: flex; align-items: center; gap: 6px; }
.progress-amounts { font-size: 12px; color: var(--text2); font-weight: 600; }
.progress-pct {
  font-size: 11px; font-weight: 700;
  padding: 2px 7px; border-radius: 20px;
}
.progress-pct.green { background: var(--green-bg); color: var(--green-text); }
.progress-pct.amber { background: var(--amber-bg); color: var(--amber-text); }
.progress-pct.red { background: var(--red-bg); color: var(--red-text); }
.progress-bar { height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }
.progress-fill.green { background: var(--green); }
.progress-fill.amber { background: var(--amber); }
.progress-fill.red { background: var(--red); }

/* FORM */
.form-row { margin-bottom: 12px; }
.form-label {
  font-family: 'Syne', sans-serif;
  font-size: 10px; font-weight: 700; color: var(--text3);
  margin-bottom: 6px; display: block;
  text-transform: uppercase; letter-spacing: 0.08em;
}
input, select {
  width: 100%; padding: 12px 15px;
  border: 1.5px solid var(--border2);
  border-radius: var(--radius-sm);
  font-size: 16px; color: var(--text);
  background: var(--surface2);
  font-family: 'Instrument Sans', sans-serif;
  appearance: none; -webkit-appearance: none; outline: none;
  transition: border-color 0.2s, background 0.2s;
}
input::placeholder { color: var(--text3); }
input:focus, select:focus {
  border-color: var(--accent);
  background: var(--accent-light);
}

/* CATEGORY CHIPS */
.cat-chips { display: flex; flex-wrap: wrap; gap: 7px; }
.cat-chip {
  display: flex; align-items: center; gap: 5px;
  padding: 8px 13px; border-radius: 30px;
  border: 1.5px solid var(--border2);
  background: var(--surface2);
  font-size: 13px; font-weight: 500; color: var(--text2);
  cursor: pointer; transition: all 0.15s; user-select: none;
  white-space: nowrap;
}
.cat-chip:active { transform: scale(0.93); }
.cat-chip.selected {
  background: var(--accent-light);
  border-color: var(--accent);
  color: var(--accent-text);
  font-weight: 600;
}

/* BUTTONS */
.btn {
  width: 100%; padding: 14px;
  border: none; border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 700;
  cursor: pointer; font-family: 'Syne', sans-serif;
  transition: all 0.15s; letter-spacing: 0.01em;
}
.btn:active { transform: scale(0.97); }
.btn-accent {
  background: var(--accent); color: #fff;
  box-shadow: 0 4px 16px rgba(91,79,232,0.28);
}
.btn-accent:active { box-shadow: none; }
.btn-outline {
  background: var(--surface); border: 1.5px solid var(--border2);
  color: var(--text2); width: auto; padding: 8px 14px;
  font-size: 12px; box-shadow: var(--shadow);
}

/* ENTRIES */
.entry-item {
  display: flex; align-items: center;
  padding: 11px 0; border-bottom: 1px solid var(--border);
}
.entry-item:last-child { border-bottom: none; padding-bottom: 0; }
.entry-item:first-child { padding-top: 0; }
.entry-icon {
  width: 38px; height: 38px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; margin-right: 11px; flex-shrink: 0;
  background: var(--surface2);
}
.entry-left { flex: 1; min-width: 0; }
.entry-desc { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry-meta { font-size: 12px; color: var(--text3); margin-top: 1px; font-weight: 500; }
.entry-amount {
  font-family: 'Syne', sans-serif;
  font-size: 14px; font-weight: 700; color: var(--red);
  flex-shrink: 0; margin-left: 8px;
}
.del-btn {
  background: none; border: none; cursor: pointer;
  color: var(--text3); font-size: 19px;
  padding: 4px 0 4px 10px; flex-shrink: 0;
  transition: color 0.15s;
}
.del-btn:active { color: var(--red); }

/* LIST ITEMS (fix + cat) */
.list-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 0; border-bottom: 1px solid var(--border);
}
.list-item:last-child { border-bottom: none; padding-bottom: 0; }
.list-item:first-child { padding-top: 0; }
.list-left { display: flex; align-items: center; gap: 10px; }
.list-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--surface2);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; flex-shrink: 0;
}
.list-name { font-size: 14px; font-weight: 500; }
.list-sub { font-size: 12px; color: var(--text3); margin-top: 1px; font-weight: 500; }
.list-right { display: flex; align-items: center; gap: 6px; }
.list-amount { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: var(--text2); }

.action-btns { display: flex; align-items: center; }
.icon-btn {
  background: none; border: none; cursor: pointer;
  font-size: 15px; padding: 6px 7px; border-radius: 8px;
  transition: background 0.15s; line-height: 1;
}
.icon-btn:active { background: var(--surface2); }

/* EMPTY */
.empty-state {
  text-align: center; padding: 28px 0 8px;
  color: var(--text3); font-size: 14px; line-height: 1.7;
}
.empty-icon { font-size: 30px; margin-bottom: 8px; opacity: 0.4; }

/* MODAL */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: none; align-items: flex-end; justify-content: center; z-index: 200;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: 22px 22px 0 0;
  padding: 8px 20px 44px;
  width: 100%; max-width: 430px;
  max-height: 88vh; overflow-y: auto;
  box-shadow: 0 -4px 40px rgba(0,0,0,0.1);
}
.modal-handle {
  width: 36px; height: 4px;
  background: var(--surface3); border-radius: 2px;
  margin: 12px auto 18px;
}
.modal-title {
  font-family: 'Syne', sans-serif;
  font-size: 18px; font-weight: 800; margin-bottom: 18px;
  letter-spacing: -0.3px;
}
.modal-footer { display: flex; gap: 10px; margin-top: 18px; }
.modal-footer .btn { flex: 1; }

/* EMOJI GRID */
.emoji-grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 7px; margin-top: 6px;
}
.emoji-btn {
  aspect-ratio: 1; border: 1.5px solid var(--border);
  border-radius: 10px; background: var(--surface2);
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.12s;
}
.emoji-btn:active { transform: scale(0.85); }
.emoji-btn.selected {
  border-color: var(--accent);
  background: var(--accent-light);
  box-shadow: 0 0 0 3px rgba(91,79,232,0.1);
}

/* TOAST */
#toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: #fff;
  padding: 11px 22px; border-radius: 30px;
  font-size: 14px; font-weight: 600;
  opacity: 0; transition: opacity 0.25s;
  pointer-events: none; z-index: 300; white-space: nowrap;
  box-shadow: var(--shadow-md);
  font-family: 'Syne', sans-serif;
}
#toast.show { opacity: 1; }
.no-data { font-size: 13px; color: var(--text3); padding: 4px 0; }
</style>
</head>
<body>

<div id="toast"></div>
<div class="app">

  <div class="header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">💰</div>
        <span class="logo-text">Budget</span>
      </div>
      <div class="month-nav">
        <button class="month-btn" onclick="changeMonth(-1)">‹</button>
        <span class="month-label" id="monthLabel"></span>
        <button class="month-btn" onclick="changeMonth(1)">›</button>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab active" onclick="showTab('overview')">Übersicht</div>
    <div class="tab" onclick="showTab('ausgaben')">Ausgaben</div>
    <div class="tab" onclick="showTab('einstellungen')">Einstellungen</div>
  </div>

  <!-- OVERVIEW -->
  <div id="tab-overview" class="page active">
    <div id="overviewContent"></div>
  </div>

  <!-- AUSGABEN -->
  <div id="tab-ausgaben" class="page">
    <div class="section-title">Ausgabe eintragen</div>
    <div class="card">
      <div class="form-row">
        <label class="form-label">Beschreibung</label>
        <input type="text" id="entryDesc" placeholder="z.B. Supermarkt, Kino…" autocomplete="off" />
      </div>
      <div class="form-row">
        <label class="form-label">Betrag (€)</label>
        <input type="number" id="entryAmount" placeholder="0,00" step="0.01" min="0" inputmode="decimal" />
      </div>
      <div class="form-row">
        <label class="form-label">Kategorie</label>
        <div class="cat-chips" id="entryCatChips"></div>
      </div>
      <div class="form-row" style="margin-bottom:16px">
        <label class="form-label">Datum</label>
        <input type="date" id="entryDate" />
      </div>
      <button class="btn btn-accent" onclick="addEntry()">Eintragen</button>
    </div>

    <div class="section-title">Diesen Monat</div>
    <div class="card" id="entryList"></div>
  </div>

  <!-- EINSTELLUNGEN -->
  <div id="tab-einstellungen" class="page">
    <div class="section-title">Gehalt</div>
    <div class="card">
      <div class="form-row" style="margin-bottom:16px">
        <label class="form-label">Netto-Gehalt (€)</label>
        <input type="number" id="setGehalt" placeholder="z.B. 2500" inputmode="decimal" />
      </div>
      <button class="btn btn-accent" onclick="saveSettings()">Speichern</button>
    </div>

    <div class="section-row">
      <div class="section-title">Fixkosten</div>
      <button class="btn btn-outline" onclick="openFixModal(null)">+ Hinzufügen</button>
    </div>
    <div class="card" id="fixkostenList"></div>

    <div class="section-row">
      <div class="section-title">Kategorien</div>
      <button class="btn btn-outline" onclick="openCatModal(null)">+ Neu</button>
    </div>
    <div class="card" id="catList"></div>
  </div>

</div>

<!-- FIXKOSTEN MODAL -->
<div id="fixModal" class="modal-backdrop" onclick="if(event.target===this)closeModal('fixModal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="fixModalTitle">Fixkosten hinzufügen</div>
    <div class="form-row">
      <label class="form-label">Bezeichnung</label>
      <input type="text" id="fixName" placeholder="z.B. Miete, Netflix, Strom…" />
    </div>
    <div class="form-row">
      <label class="form-label">Betrag pro Monat (€)</label>
      <input type="number" id="fixAmount" placeholder="0,00" inputmode="decimal" />
    </div>
    <div class="form-row">
      <label class="form-label">Icon</label>
      <div class="emoji-grid" id="fixEmojiGrid"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" style="flex:1" onclick="closeModal('fixModal')">Abbrechen</button>
      <button class="btn btn-accent" style="flex:1" id="fixSaveBtn" onclick="saveFix()">Hinzufügen</button>
    </div>
  </div>
</div>

<!-- KATEGORIE MODAL -->
<div id="catModal" class="modal-backdrop" onclick="if(event.target===this)closeModal('catModal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="catModalTitle">Kategorie erstellen</div>
    <div class="form-row">
      <label class="form-label">Name</label>
      <input type="text" id="catName" placeholder="z.B. Restaurant, Kleidung…" />
    </div>
    <div class="form-row">
      <label class="form-label">Budget pro Monat (€, optional)</label>
      <input type="number" id="catBudget" placeholder="0 = kein Limit" inputmode="decimal" />
    </div>
    <div class="form-row">
      <label class="form-label">Icon wählen</label>
      <div class="emoji-grid" id="catEmojiGrid"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" style="flex:1" onclick="closeModal('catModal')">Abbrechen</button>
      <button class="btn btn-accent" style="flex:1" id="catSaveBtn" onclick="saveCat()">Erstellen</button>
    </div>
  </div>
</div>

<script>
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const EMOJIS_FIX = ['🏠','📺','📱','💡','🚗','🏋️','💊','🌐','🎵','🔑','🛡','📦','🏦','🚿','⚡','🌡','🐕','🎓','🧾','💈'];
const EMOJIS_CAT = ['🛒','🎉','🍕','🚌','👕','💊','🏖','📚','🐾','🎮','☕','🍺','✈️','💄','🎁','🍔','🎬','🏃','🌿','🛠','🎨','🏥','🧴','🍷','🎭','🛍','🍣','🏡','🎯','⚽'];

const DEFAULT_CATS = [
  { id: 'lebensmittel', name: 'Lebensmittel', emoji: '🛒', budget: 0 },
  { id: 'freizeit',     name: 'Freizeit',     emoji: '🎉', budget: 0 },
  { id: 'sonstiges',   name: 'Sonstiges',    emoji: '📋', budget: 0 },
];

let state = {
  settings: { gehalt: 0 },
  fixkosten: [],
  categories: JSON.parse(JSON.stringify(DEFAULT_CATS)),
  entries: {}
};

let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let selectedCatId = null;
let fixEditIdx = null;
let catEditIdx = null;
let selectedFixEmoji = '🏠';
let selectedCatEmoji = '🛒';

/* ── PERSISTENCE ── */
function loadState() {
  try {
    const raw = localStorage.getItem('budget_v4');
    if (raw) {
      const p = JSON.parse(raw);
      state = p;
      if (!state.categories?.length) state.categories = JSON.parse(JSON.stringify(DEFAULT_CATS));
    }
  } catch(e) {}
  document.getElementById('setGehalt').value = state.settings.gehalt || '';
  render();
}
function saveState() {
  try { localStorage.setItem('budget_v4', JSON.stringify(state)); } catch(e) {}
}

/* ── HELPERS ── */
function monthKey() { return currentYear + '-' + String(currentMonth+1).padStart(2,'0'); }
function getEntries() { return state.entries[monthKey()] || []; }
function fmt(n) { return Number(n).toLocaleString('de-AT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pct(spent,budget) { return budget ? Math.min(100,Math.round(spent/budget*100)) : 0; }
function barColor(p) { return p>=100?'red':p>=75?'amber':'green'; }

/* ── NAVIGATION ── */
function changeMonth(d) {
  currentMonth += d;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
  render();
}

function showTab(name) {
  ['overview','ausgaben','einstellungen'].forEach((t,i) =>
    document.querySelectorAll('.tab')[i].classList.toggle('active', t===name));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  render();
}

/* ── RENDER ── */
function render() {
  document.getElementById('monthLabel').textContent = MONTHS[currentMonth]+' '+currentYear;
  renderOverview();
  renderCatChips();
  renderEntries();
  renderFixkosten();
  renderCatList();
  setTodayDate();
}

function setTodayDate() {
  const d = document.getElementById('entryDate');
  if (d && !d.value) d.value = new Date().toISOString().split('T')[0];
}

function renderOverview() {
  const entries = getEntries();
  const gehalt = parseFloat(state.settings.gehalt||0);
  const totalFixed = state.fixkosten.reduce((a,f)=>a+parseFloat(f.amount||0),0);
  const spentByCat = {};
  entries.forEach(e => { spentByCat[e.catId] = (spentByCat[e.catId]||0)+parseFloat(e.amount); });
  const totalSpent = Object.values(spentByCat).reduce((a,b)=>a+b,0);
  const frei = gehalt - totalFixed - totalSpent;
  const freiColor = frei<0?'red':frei<gehalt*0.1?'amber':'green';

  const catsWithBudget = state.categories.filter(c=>c.budget>0);
  const catsNoBudget   = state.categories.filter(c=>!c.budget&&(spentByCat[c.id]||0)>0);

  let budgetHTML = '';
  [...catsWithBudget,...catsNoBudget].forEach(c => {
    const spent = spentByCat[c.id]||0;
    const hasBudget = c.budget>0;
    const p = pct(spent,c.budget);
    const bc = barColor(p);
    budgetHTML += `<div class="progress-row">
      <div class="progress-header">
        <div class="progress-left">
          <div class="progress-emoji">${c.emoji}</div>
          <span class="progress-name">${esc(c.name)}</span>
          ${hasBudget?`<span class="progress-pct ${bc}">${p}%</span>`:''}
        </div>
        <span class="progress-amounts">${fmt(spent)}${hasBudget?' / '+fmt(c.budget):''}</span>
      </div>
      ${hasBudget?`<div class="progress-bar"><div class="progress-fill ${bc}" style="width:${p}%"></div></div>`:''}
    </div>`;
  });
  if (!budgetHTML) budgetHTML = '<p class="no-data">Noch keine Ausgaben diesen Monat.</p>';

  const fixHTML = state.fixkosten.length
    ? state.fixkosten.map(f=>`<div class="list-item">
        <div class="list-left">
          <div class="list-icon">${f.emoji||'📦'}</div>
          <span class="list-name">${esc(f.name)}</span>
        </div>
        <span class="list-amount">${fmt(f.amount)}</span>
      </div>`).join('')
    : '<p class="no-data">Noch keine Fixkosten.</p>';

  document.getElementById('overviewContent').innerHTML = `
    <div class="metric-grid">
      <div class="metric accent-card"><div class="metric-label">Gehalt</div><div class="metric-value">${fmt(gehalt)}</div></div>
      <div class="metric"><div class="metric-label">Verfügbar</div><div class="metric-value ${freiColor}">${fmt(frei)}</div></div>
      <div class="metric"><div class="metric-label">Fixkosten</div><div class="metric-value">${fmt(totalFixed)}</div></div>
      <div class="metric"><div class="metric-label">Ausgaben</div><div class="metric-value red">${fmt(totalSpent)}</div></div>
    </div>
    <div class="section-title">Ausgaben nach Kategorie</div>
    <div class="card">${budgetHTML}</div>
    <div class="section-title">Fixkosten</div>
    <div class="card">${fixHTML}</div>`;
}

function renderCatChips() {
  const el = document.getElementById('entryCatChips');
  if (!el) return;
  if (!selectedCatId && state.categories.length) selectedCatId = state.categories[0].id;
  el.innerHTML = state.categories.map(c=>`
    <div class="cat-chip ${selectedCatId===c.id?'selected':''}" onclick="selectCat('${c.id}')">
      <span>${c.emoji}</span><span>${esc(c.name)}</span>
    </div>`).join('');
}

function selectCat(id) { selectedCatId = id; renderCatChips(); }

function renderEntries() {
  const el = document.getElementById('entryList');
  if (!el) return;
  const entries = getEntries();
  if (!entries.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div>Noch keine Ausgaben diesen Monat.</div>';
    return;
  }
  const catMap = Object.fromEntries(state.categories.map(c=>[c.id,c]));
  const sorted = entries.map((e,i)=>({...e,origIdx:i})).sort((a,b)=>b.date.localeCompare(a.date));
  el.innerHTML = sorted.map(e => {
    const cat = catMap[e.catId]||{emoji:'📋',name:e.catId};
    const d = new Date(e.date+'T00:00:00');
    const ds = d.toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit'});
    return `<div class="entry-item">
      <div class="entry-icon">${cat.emoji}</div>
      <div class="entry-left">
        <div class="entry-desc">${esc(e.description)}</div>
        <div class="entry-meta">${ds} · ${esc(cat.name)}</div>
      </div>
      <span class="entry-amount">−${fmt(e.amount)}</span>
      <button class="del-btn" onclick="deleteEntry(${e.origIdx})">×</button>
    </div>`;
  }).join('');
}

function renderFixkosten() {
  const el = document.getElementById('fixkostenList');
  if (!el) return;
  if (!state.fixkosten.length) {
    el.innerHTML = '<p class="no-data">Noch keine Fixkosten. Füge welche hinzu.</p>';
    return;
  }
  el.innerHTML = state.fixkosten.map((f,i)=>`
    <div class="list-item">
      <div class="list-left">
        <div class="list-icon">${f.emoji||'📦'}</div>
        <div><div class="list-name">${esc(f.name)}</div></div>
      </div>
      <div class="list-right">
        <span class="list-amount">${fmt(f.amount)}</span>
        <div class="action-btns">
          <button class="icon-btn" onclick="openFixModal(${i})" title="Bearbeiten">✏️</button>
          <button class="icon-btn" onclick="deleteFix(${i})" title="Löschen" style="color:var(--red)">×</button>
        </div>
      </div>
    </div>`).join('');
}

function renderCatList() {
  const el = document.getElementById('catList');
  if (!el) return;
  if (!state.categories.length) {
    el.innerHTML = '<p class="no-data">Keine Kategorien vorhanden.</p>';
    return;
  }
  el.innerHTML = state.categories.map((c,i)=>`
    <div class="list-item">
      <div class="list-left">
        <div class="list-icon">${c.emoji}</div>
        <div>
          <div class="list-name">${esc(c.name)}</div>
          <div class="list-sub">${c.budget>0?'Budget: '+fmt(c.budget)+'/Monat':'Kein Limit'}</div>
        </div>
      </div>
      <div class="action-btns">
        <button class="icon-btn" onclick="openCatModal(${i})" title="Bearbeiten">✏️</button>
        <button class="icon-btn" onclick="deleteCat(${i})" title="Löschen" style="font-size:19px;color:var(--red)">×</button>
      </div>
    </div>`).join('');
}

/* ── SETTINGS ── */
function saveSettings() {
  state.settings.gehalt = parseFloat(document.getElementById('setGehalt').value)||0;
  saveState(); toast('Gespeichert ✓'); renderOverview();
}

/* ── ENTRIES ── */
function addEntry() {
  const desc   = document.getElementById('entryDesc').value.trim();
  const amount = parseFloat(document.getElementById('entryAmount').value);
  const date   = document.getElementById('entryDate').value;
  if (!desc)              { toast('Bitte Beschreibung eingeben.'); return; }
  if (!amount||amount<=0) { toast('Bitte gültigen Betrag eingeben.'); return; }
  if (!date)              { toast('Bitte Datum wählen.'); return; }
  if (!selectedCatId)     { toast('Bitte Kategorie wählen.'); return; }
  const key = monthKey();
  if (!state.entries[key]) state.entries[key] = [];
  state.entries[key].push({ description:desc, amount, catId:selectedCatId, date });
  document.getElementById('entryDesc').value = '';
  document.getElementById('entryAmount').value = '';
  saveState(); toast('Ausgabe eingetragen ✓');
  renderEntries(); renderOverview();
}

function deleteEntry(idx) {
  if (!confirm('Eintrag löschen?')) return;
  state.entries[monthKey()].splice(idx,1);
  saveState(); renderEntries(); renderOverview();
}

/* ── EMOJI GRIDS ── */
function buildEmojiGrid(containerId, list, currentEmoji, onSelectFnName) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = list.map(e=>`
    <button class="emoji-btn ${currentEmoji===e?'selected':''}"
      onclick="${onSelectFnName}('${e}')">${e}</button>`).join('');
}

/* ── MODALS ── */
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

/* FIXKOSTEN */
function openFixModal(idx) {
  fixEditIdx = idx;
  const isEdit = idx !== null;
  document.getElementById('fixModalTitle').textContent = isEdit ? 'Fixkosten bearbeiten' : 'Fixkosten hinzufügen';
  document.getElementById('fixSaveBtn').textContent    = isEdit ? 'Speichern' : 'Hinzufügen';
  if (isEdit) {
    const f = state.fixkosten[idx];
    document.getElementById('fixName').value   = f.name;
    document.getElementById('fixAmount').value = f.amount;
    selectedFixEmoji = f.emoji||'🏠';
  } else {
    document.getElementById('fixName').value   = '';
    document.getElementById('fixAmount').value = '';
    selectedFixEmoji = '🏠';
  }
  buildEmojiGrid('fixEmojiGrid', EMOJIS_FIX, selectedFixEmoji, 'selectFixEmoji');
  openModal('fixModal');
}

function selectFixEmoji(e) {
  selectedFixEmoji = e;
  buildEmojiGrid('fixEmojiGrid', EMOJIS_FIX, selectedFixEmoji, 'selectFixEmoji');
}

function saveFix() {
  const name   = document.getElementById('fixName').value.trim();
  const amount = parseFloat(document.getElementById('fixAmount').value);
  if (!name||!amount||amount<=0) { toast('Bitte Name und Betrag eingeben.'); return; }
  const obj = { name, amount, emoji: selectedFixEmoji };
  if (fixEditIdx !== null) {
    state.fixkosten[fixEditIdx] = obj;
    toast('Fixkosten aktualisiert ✓');
  } else {
    state.fixkosten.push(obj);
    toast('Fixkosten hinzugefügt ✓');
  }
  saveState(); closeModal('fixModal');
  renderFixkosten(); renderOverview();
}

function deleteFix(idx) {
  if (!confirm('Fixkosten löschen?')) return;
  state.fixkosten.splice(idx,1);
  saveState(); renderFixkosten(); renderOverview();
}

/* KATEGORIEN */
function openCatModal(idx) {
  catEditIdx = idx;
  const isEdit = idx !== null;
  document.getElementById('catModalTitle').textContent = isEdit ? 'Kategorie bearbeiten' : 'Kategorie erstellen';
  document.getElementById('catSaveBtn').textContent    = isEdit ? 'Speichern' : 'Erstellen';
  if (isEdit) {
    const c = state.categories[idx];
    document.getElementById('catName').value   = c.name;
    document.getElementById('catBudget').value = c.budget||'';
    selectedCatEmoji = c.emoji||'🛒';
  } else {
    document.getElementById('catName').value   = '';
    document.getElementById('catBudget').value = '';
    selectedCatEmoji = '🛒';
  }
  buildEmojiGrid('catEmojiGrid', EMOJIS_CAT, selectedCatEmoji, 'selectCatEmoji');
  openModal('catModal');
}

function selectCatEmoji(e) {
  selectedCatEmoji = e;
  buildEmojiGrid('catEmojiGrid', EMOJIS_CAT, selectedCatEmoji, 'selectCatEmoji');
}

function saveCat() {
  const name   = document.getElementById('catName').value.trim();
  const budget = parseFloat(document.getElementById('catBudget').value)||0;
  if (!name) { toast('Bitte einen Namen eingeben.'); return; }
  if (catEditIdx !== null) {
    state.categories[catEditIdx] = { ...state.categories[catEditIdx], name, budget, emoji: selectedCatEmoji };
    toast('Kategorie aktualisiert ✓');
  } else {
    state.categories.push({ id:'cat_'+Date.now(), name, emoji:selectedCatEmoji, budget });
    toast('Kategorie erstellt ✓');
  }
  saveState(); closeModal('catModal');
  renderCatList(); renderCatChips(); renderOverview();
}

function deleteCat(idx) {
  if (!confirm('Kategorie löschen?')) return;
  if (selectedCatId === state.categories[idx].id) selectedCatId = null;
  state.categories.splice(idx,1);
  saveState(); renderCatList(); renderCatChips(); renderOverview();
}

/* ── TOAST ── */
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2500);
}

loadState();
</script>
</body>
</html>
