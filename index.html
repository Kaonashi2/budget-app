<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<title>Budget Planer</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;scroll-behavior:smooth}

:root {
  --bg: #0a0a0f;
  --bg2: #111118;
  --surface: rgba(255,255,255,0.05);
  --surface2: rgba(255,255,255,0.08);
  --surface3: rgba(255,255,255,0.12);
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #f0f0f8;
  --text2: #9090a8;
  --text3: #50505f;
  --accent: #7c6fff;
  --accent2: #a89dff;
  --accent-glow: rgba(124,111,255,0.25);
  --green: #2ecc8a;
  --green-bg: rgba(46,204,138,0.12);
  --red: #ff6b6b;
  --red-bg: rgba(255,107,107,0.12);
  --amber: #ffb347;
  --amber-bg: rgba(255,179,71,0.12);
  --radius: 18px;
  --radius-sm: 12px;
  --radius-xs: 8px;
}

body {
  font-family: 'Instrument Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* Background glow effect */
body::before {
  content: '';
  position: fixed;
  top: -30%;
  left: -20%;
  width: 70%;
  height: 70%;
  background: radial-gradient(ellipse, rgba(124,111,255,0.08) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  bottom: -20%;
  right: -20%;
  width: 60%;
  height: 60%;
  background: radial-gradient(ellipse, rgba(46,204,138,0.06) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.app { max-width: 430px; margin: 0 auto; position: relative; z-index: 1; }

/* HEADER */
.header {
  padding: 56px 20px 0;
  position: sticky; top: 0; z-index: 50;
  background: linear-gradient(to bottom, var(--bg) 60%, transparent);
}
.header-inner {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 16px;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), #a89dff);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.logo-text { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
.month-nav { display: flex; align-items: center; gap: 6px; }
.month-btn {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid var(--border2);
  background: var(--surface2);
  font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text); backdrop-filter: blur(10px);
  transition: all 0.15s;
}
.month-btn:active { background: var(--surface3); transform: scale(0.92); }
.month-label {
  font-size: 13px; font-weight: 600; min-width: 108px;
  text-align: center; color: var(--text2);
  font-family: 'Syne', sans-serif; letter-spacing: 0.02em;
}

/* TABS */
.tab-bar {
  display: flex; gap: 4px;
  padding: 0 20px 16px;
  background: linear-gradient(to bottom, var(--bg), transparent);
  position: sticky; top: 84px; z-index: 49;
}
.tab {
  flex: 1; padding: 9px 4px; text-align: center;
  font-size: 12px; font-weight: 600; cursor: pointer;
  color: var(--text3); border-radius: var(--radius-xs);
  transition: all 0.2s; letter-spacing: 0.03em;
  font-family: 'Syne', sans-serif;
  border: 1px solid transparent;
  user-select: none;
}
.tab.active {
  color: var(--accent2);
  background: var(--surface);
  border-color: var(--border2);
  backdrop-filter: blur(10px);
}

/* PAGES */
.page { display: none; padding: 0 16px 100px; }
.page.active { display: block; }

/* SECTION TITLES */
.section-title {
  font-family: 'Syne', sans-serif;
  font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text3);
  margin: 24px 4px 10px;
}
.section-title:first-child { margin-top: 4px; }
.section-row {
  display: flex; align-items: center; justify-content: space-between;
  margin: 24px 4px 10px;
}
.section-row .section-title { margin: 0; }

/* GLASS CARD */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 10px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
}

/* METRIC GRID */
.metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.metric {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px;
  backdrop-filter: blur(20px);
  position: relative; overflow: hidden;
}
.metric.highlight {
  background: linear-gradient(135deg, rgba(124,111,255,0.15), rgba(124,111,255,0.05));
  border-color: rgba(124,111,255,0.3);
}
.metric-label {
  font-size: 10px; font-weight: 700; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 8px; font-family: 'Syne', sans-serif;
}
.metric-value {
  font-size: 22px; font-weight: 700; color: var(--text);
  letter-spacing: -1px; font-family: 'Syne', sans-serif;
  line-height: 1;
}
.metric-value.green { color: var(--green); }
.metric-value.red { color: var(--red); }
.metric-value.amber { color: var(--amber); }

/* PROGRESS BARS */
.progress-row { margin-bottom: 16px; }
.progress-row:last-child { margin-bottom: 0; }
.progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.progress-left { display: flex; align-items: center; gap: 8px; }
.progress-emoji { font-size: 15px; }
.progress-name { font-size: 14px; font-weight: 500; color: var(--text); }
.progress-amounts { font-size: 12px; color: var(--text2); font-weight: 500; }
.progress-bar {
  height: 6px; background: rgba(255,255,255,0.06);
  border-radius: 3px; overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 3px;
  transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  position: relative;
}
.progress-fill.green { background: linear-gradient(90deg, var(--green), #5effc0); }
.progress-fill.amber { background: linear-gradient(90deg, var(--amber), #ffd080); }
.progress-fill.red { background: linear-gradient(90deg, var(--red), #ff9090); }
.progress-pct {
  font-size: 11px; font-weight: 600; color: var(--text3);
  margin-left: 8px;
}

/* FORM */
.form-row { margin-bottom: 12px; }
.form-label {
  font-size: 11px; font-weight: 700; color: var(--text3);
  margin-bottom: 6px; display: block;
  text-transform: uppercase; letter-spacing: 0.07em;
  font-family: 'Syne', sans-serif;
}
input, select {
  width: 100%; padding: 13px 16px;
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  font-size: 16px; color: var(--text);
  background: var(--surface2);
  font-family: 'Instrument Sans', sans-serif;
  appearance: none; -webkit-appearance: none;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
}
input::placeholder { color: var(--text3); }
input:focus, select:focus {
  border-color: var(--accent);
  background: rgba(124,111,255,0.08);
}
select option { background: #1a1a2e; color: var(--text); }

/* CATEGORY CHIPS */
.cat-chips {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-bottom: 0;
}
.cat-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: 30px;
  border: 1px solid var(--border2);
  background: var(--surface2);
  font-size: 13px; font-weight: 500; color: var(--text2);
  cursor: pointer; transition: all 0.15s; user-select: none;
  white-space: nowrap;
}
.cat-chip:active { transform: scale(0.94); }
.cat-chip.selected {
  background: var(--accent-glow);
  border-color: var(--accent);
  color: var(--accent2);
}

/* BUTTONS */
.btn {
  width: 100%; padding: 14px;
  border: none; border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 600;
  cursor: pointer; font-family: 'Syne', sans-serif;
  transition: all 0.15s; letter-spacing: 0.02em;
}
.btn:active { transform: scale(0.97); opacity: 0.85; }
.btn-accent {
  background: linear-gradient(135deg, var(--accent), #a89dff);
  color: #fff;
  box-shadow: 0 4px 24px rgba(124,111,255,0.3);
}
.btn-outline {
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--text2); width: auto; padding: 8px 16px; font-size: 13px;
}

/* ENTRIES */
.entry-item {
  display: flex; align-items: center;
  padding: 12px 0; border-bottom: 1px solid var(--border);
  transition: opacity 0.2s;
}
.entry-item:last-child { border-bottom: none; padding-bottom: 0; }
.entry-item:first-child { padding-top: 0; }
.entry-icon {
  width: 40px; height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; margin-right: 12px; flex-shrink: 0;
  background: var(--surface2);
}
.entry-left { flex: 1; min-width: 0; }
.entry-desc {
  font-size: 14px; font-weight: 500; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.entry-meta { font-size: 12px; color: var(--text3); margin-top: 2px; font-weight: 500; }
.entry-amount {
  font-size: 15px; font-weight: 700; color: var(--red);
  font-family: 'Syne', sans-serif; flex-shrink: 0; margin-left: 8px;
}
.del-btn {
  background: none; border: none; cursor: pointer;
  color: var(--text3); font-size: 20px;
  padding: 4px 0 4px 10px; line-height: 1; flex-shrink: 0;
  transition: color 0.15s;
}
.del-btn:active { color: var(--red); }

/* FIXKOSTEN */
.fix-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.fix-item:last-child { border-bottom: none; padding-bottom: 0; }
.fix-item:first-child { padding-top: 0; }
.fix-left { display: flex; align-items: center; gap: 10px; }
.fix-icon { font-size: 18px; width: 36px; height: 36px; display:flex;align-items:center;justify-content:center; background:var(--surface2); border-radius:10px; }
.fix-name { font-size: 14px; font-weight: 500; }
.fix-right { display: flex; align-items: center; gap: 10px; }
.fix-amount { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: var(--text2); }

/* CATEGORY ITEMS in settings */
.cat-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.cat-item:last-child { border-bottom: none; padding-bottom: 0; }
.cat-item:first-child { padding-top: 0; }
.cat-left { display: flex; align-items: center; gap: 10px; }
.cat-badge {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; flex-shrink: 0;
}
.cat-name { font-size: 14px; font-weight: 500; }

/* EMPTY */
.empty-state {
  text-align: center; padding: 32px 0 8px;
  color: var(--text3); font-size: 14px; line-height: 1.7;
}
.empty-icon { font-size: 32px; margin-bottom: 8px; opacity: 0.5; }

/* MODAL */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none; align-items: flex-end; justify-content: center; z-index: 200;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: #15151f;
  border: 1px solid var(--border2);
  border-radius: 24px 24px 0 0;
  padding: 20px 20px 44px;
  width: 100%; max-width: 430px;
  max-height: 85vh; overflow-y: auto;
}
.modal::before {
  content: '';
  display: block;
  width: 36px; height: 4px;
  background: var(--border2); border-radius: 2px;
  margin: 0 auto 20px;
}
.modal-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 18px; }
.modal-footer { display: flex; gap: 10px; margin-top: 18px; }
.modal-footer .btn { flex: 1; }

/* EMOJI PICKER */
.emoji-grid {
  display: grid; grid-template-columns: repeat(6, 1fr);
  gap: 8px; margin-top: 8px;
}
.emoji-btn {
  aspect-ratio: 1; border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  background: var(--surface2);
  font-size: 20px; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  transition: all 0.15s;
}
.emoji-btn:active { transform: scale(0.88); }
.emoji-btn.selected { border-color: var(--accent); background: var(--accent-glow); }

/* TOAST */
#toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  background: rgba(20,20,30,0.95);
  border: 1px solid var(--border2);
  backdrop-filter: blur(20px);
  color: var(--text); padding: 11px 22px;
  border-radius: 30px; font-size: 14px; font-weight: 500;
  opacity: 0; transition: opacity 0.25s;
  pointer-events: none; z-index: 300; white-space: nowrap;
}
#toast.show { opacity: 1; }

.no-data { font-size: 13px; color: var(--text3); padding: 4px 0; }

/* SUMMARY BAR */
.summary-bar {
  display: flex; gap: 6px; margin-bottom: 12px;
}
.summary-pill {
  flex: 1; padding: 10px 8px; border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  text-align: center;
}
.summary-pill-label { font-size: 10px; color: var(--text3); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-family: 'Syne', sans-serif; }
.summary-pill-value { font-size: 16px; font-weight: 700; font-family: 'Syne', sans-serif; margin-top: 2px; }

/* Color swatches for categories */
.color-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.color-swatch {
  width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
  border: 2px solid transparent; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.color-swatch.selected { border-color: #fff; transform: scale(1.1); }

.divider { height: 1px; background: var(--border); margin: 4px 0; }
</style>
</head>
<body>
<div id="toast"></div>
<div class="app">

  <div class="header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">💰</div>
        <span class="logo-text">Budget</span>
      </div>
      <div class="month-nav">
        <button class="month-btn" onclick="changeMonth(-1)">‹</button>
        <span class="month-label" id="monthLabel"></span>
        <button class="month-btn" onclick="changeMonth(1)">›</button>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab active" onclick="showTab('overview')">Übersicht</div>
    <div class="tab" onclick="showTab('ausgaben')">Ausgaben</div>
    <div class="tab" onclick="showTab('einstellungen')">Einstellungen</div>
  </div>

  <!-- OVERVIEW -->
  <div id="tab-overview" class="page active">
    <div id="overviewContent"></div>
  </div>

  <!-- AUSGABEN -->
  <div id="tab-ausgaben" class="page">
    <div class="section-title">Ausgabe eintragen</div>
    <div class="card">
      <div class="form-row">
        <label class="form-label">Beschreibung</label>
        <input type="text" id="entryDesc" placeholder="z.B. Supermarkt, Kino…" autocomplete="off" />
      </div>
      <div class="form-row">
        <label class="form-label">Betrag (€)</label>
        <input type="number" id="entryAmount" placeholder="0,00" step="0.01" min="0" inputmode="decimal" />
      </div>
      <div class="form-row">
        <label class="form-label">Kategorie</label>
        <div class="cat-chips" id="entryCatChips"></div>
      </div>
      <div class="form-row">
        <label class="form-label">Datum</label>
        <input type="date" id="entryDate" />
      </div>
      <button class="btn btn-accent" onclick="addEntry()">Eintragen</button>
    </div>

    <div class="section-title">Diesen Monat</div>
    <div class="card" id="entryList"></div>
  </div>

  <!-- EINSTELLUNGEN -->
  <div id="tab-einstellungen" class="page">
    <div class="section-title">Gehalt &amp; Budget</div>
    <div class="card">
      <div class="form-row">
        <label class="form-label">Netto-Gehalt (€)</label>
        <input type="number" id="setGehalt" placeholder="z.B. 2500" inputmode="decimal" />
      </div>
      <button class="btn btn-accent" onclick="saveSettings()">Speichern</button>
    </div>

    <div class="section-row">
      <div class="section-title">Fixkosten</div>
      <button class="btn btn-outline" onclick="openModal('fixModal')">+ Hinzufügen</button>
    </div>
    <div class="card" id="fixkostenList"></div>

    <div class="section-row">
      <div class="section-title">Kategorien</div>
      <button class="btn btn-outline" onclick="openCatModal()">+ Neu</button>
    </div>
    <div class="card" id="catList"></div>
  </div>

</div>

<!-- FIXKOSTEN MODAL -->
<div id="fixModal" class="modal-backdrop" onclick="if(event.target===this)closeModal('fixModal')">
  <div class="modal">
    <div class="modal-title">Fixkosten hinzufügen</div>
    <div class="form-row">
      <label class="form-label">Bezeichnung</label>
      <input type="text" id="fixName" placeholder="z.B. Miete, Netflix, Strom…" />
    </div>
    <div class="form-row">
      <label class="form-label">Betrag pro Monat (€)</label>
      <input type="number" id="fixAmount" placeholder="0,00" inputmode="decimal" />
    </div>
    <div class="form-row">
      <label class="form-label">Icon</label>
      <div class="emoji-grid" id="fixEmojiGrid"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" style="flex:1" onclick="closeModal('fixModal')">Abbrechen</button>
      <button class="btn btn-accent" style="flex:1" onclick="addFixkosten()">Hinzufügen</button>
    </div>
  </div>
</div>

<!-- KATEGORIE MODAL -->
<div id="catModal" class="modal-backdrop" onclick="if(event.target===this)closeModal('catModal')">
  <div class="modal">
    <div class="modal-title">Kategorie erstellen</div>
    <div class="form-row">
      <label class="form-label">Name</label>
      <input type="text" id="catName" placeholder="z.B. Restaurant, Kleidung…" />
    </div>
    <div class="form-row">
      <label class="form-label">Budget pro Monat (€, optional)</label>
      <input type="number" id="catBudget" placeholder="0 = kein Limit" inputmode="decimal" />
    </div>
    <div class="form-row">
      <label class="form-label">Icon wählen</label>
      <div class="emoji-grid" id="catEmojiGrid"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" style="flex:1" onclick="closeModal('catModal')">Abbrechen</button>
      <button class="btn btn-accent" style="flex:1" onclick="addCategory()">Erstellen</button>
    </div>
  </div>
</div>

<script>
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

const EMOJIS_FIX = ['🏠','📺','📱','💡','🚗','🏋️','💊','🌐','🎵','🔑','🛡','📦','🏦','🚿','⚡','🌡'];
const EMOJIS_CAT = ['🛒','🎉','🍕','🚌','👕','💊','🏖','📚','🐾','🎮','☕','🍺','✈️','💄','🎁','🍔','🎬','🏃','🌿','🛠','🎨','🏥','🧴','🍷'];

const DEFAULT_CATS = [
  { id: 'lebensmittel', name: 'Lebensmittel', emoji: '🛒', budget: 0 },
  { id: 'freizeit', name: 'Freizeit', emoji: '🎉', budget: 0 },
  { id: 'sonstiges', name: 'Sonstiges', emoji: '📋', budget: 0 },
];

let state = {
  settings: { gehalt: 0 },
  fixkosten: [],
  categories: JSON.parse(JSON.stringify(DEFAULT_CATS)),
  entries: {}
};

let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let selectedCatId = null;
let selectedFixEmoji = '🏠';
let selectedCatEmoji = '🛒';

function load() {
  try {
    const raw = localStorage.getItem('budget_v3');
    if (raw) {
      const parsed = JSON.parse(raw);
      state = parsed;
      if (!state.categories || !state.categories.length) state.categories = JSON.parse(JSON.stringify(DEFAULT_CATS));
    }
  } catch(e) {}
  applySettings();
  render();
}

function save() {
  try { localStorage.setItem('budget_v3', JSON.stringify(state)); } catch(e) {}
}

function monthKey() { return currentYear + '-' + String(currentMonth + 1).padStart(2,'0'); }
function getEntries() { return state.entries[monthKey()] || []; }

function fmt(n) {
  return Number(n).toLocaleString('de-AT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function changeMonth(d) {
  currentMonth += d;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  render();
}

function showTab(name) {
  const tabs = ['overview','ausgaben','einstellungen'];
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', tabs[i] === name));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'ausgaben') { renderCatChips(); renderEntries(); }
  if (name === 'overview') renderOverview();
  if (name === 'einstellungen') { renderFixkosten(); renderCatList(); }
}

function render() {
  document.getElementById('monthLabel').textContent = MONTHS[currentMonth] + ' ' + currentYear;
  renderOverview();
  renderCatChips();
  renderEntries();
  renderFixkosten();
  renderCatList();
  setTodayDate();
}

function setTodayDate() {
  const d = document.getElementById('entryDate');
  if (d && !d.value) d.value = new Date().toISOString().split('T')[0];
}

function renderOverview() {
  const entries = getEntries();
  const s = state.settings;
  const gehalt = parseFloat(s.gehalt || 0);
  const totalFixed = state.fixkosten.reduce((a, f) => a + parseFloat(f.amount||0), 0);

  // group by category
  const spentByCat = {};
  state.categories.forEach(c => spentByCat[c.id] = 0);
  entries.forEach(e => {
    if (spentByCat[e.catId] !== undefined) spentByCat[e.catId] += parseFloat(e.amount);
    else spentByCat[e.catId] = parseFloat(e.amount);
  });
  const totalSpent = Object.values(spentByCat).reduce((a,b) => a+b, 0);
  const frei = gehalt - totalFixed - totalSpent;
  const freiColor = frei < 0 ? 'red' : frei < gehalt * 0.1 ? 'amber' : 'green';

  function pct(spent, budget) { return budget ? Math.min(100, Math.round(spent/budget*100)) : 0; }
  function barColor(p) { return p >= 100 ? 'red' : p >= 75 ? 'amber' : 'green'; }

  // budget progress bars
  const catsWithBudget = state.categories.filter(c => c.budget > 0);
  const catsNoBudget = state.categories.filter(c => !c.budget && spentByCat[c.id] > 0);

  let budgetHTML = '';
  catsWithBudget.forEach(c => {
    const spent = spentByCat[c.id] || 0;
    const p = pct(spent, c.budget);
    budgetHTML += `<div class="progress-row">
      <div class="progress-header">
        <div class="progress-left">
          <span class="progress-emoji">${c.emoji}</span>
          <span class="progress-name">${esc(c.name)}</span>
          <span class="progress-pct">${p}%</span>
        </div>
        <span class="progress-amounts">${fmt(spent)} / ${fmt(c.budget)}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill ${barColor(p)}" style="width:${p}%"></div></div>
    </div>`;
  });
  catsNoBudget.forEach(c => {
    const spent = spentByCat[c.id] || 0;
    budgetHTML += `<div class="progress-row">
      <div class="progress-header">
        <div class="progress-left">
          <span class="progress-emoji">${c.emoji}</span>
          <span class="progress-name">${esc(c.name)}</span>
        </div>
        <span class="progress-amounts">${fmt(spent)}</span>
      </div>
    </div>`;
  });
  if (!budgetHTML) budgetHTML = '<p class="no-data">Kategorien mit Budget in den Einstellungen definieren.</p>';

  const fixHTML = state.fixkosten.length
    ? state.fixkosten.map(f => `<div class="fix-item">
        <div class="fix-left">
          <div class="fix-icon">${f.emoji||'📦'}</div>
          <span class="fix-name">${esc(f.name)}</span>
        </div>
        <span class="fix-amount">${fmt(f.amount)}</span>
      </div>`).join('')
    : '<p class="no-data">Noch keine Fixkosten definiert.</p>';

  document.getElementById('overviewContent').innerHTML = `
    <div class="metric-grid">
      <div class="metric highlight"><div class="metric-label">Gehalt</div><div class="metric-value">${fmt(gehalt)}</div></div>
      <div class="metric"><div class="metric-label">Verfügbar</div><div class="metric-value ${freiColor}">${fmt(frei)}</div></div>
      <div class="metric"><div class="metric-label">Fixkosten</div><div class="metric-value">${fmt(totalFixed)}</div></div>
      <div class="metric"><div class="metric-label">Ausgaben</div><div class="metric-value red">${fmt(totalSpent)}</div></div>
    </div>
    <div class="section-title">Kategorien</div>
    <div class="card">${budgetHTML}</div>
    <div class="section-title">Fixkosten</div>
    <div class="card">${fixHTML}</div>
  `;
}

function renderCatChips() {
  const container = document.getElementById('entryCatChips');
  if (!container) return;
  if (!selectedCatId && state.categories.length) selectedCatId = state.categories[0].id;
  container.innerHTML = state.categories.map(c => `
    <div class="cat-chip ${selectedCatId === c.id ? 'selected' : ''}" onclick="selectCat('${c.id}')">
      <span>${c.emoji}</span><span>${esc(c.name)}</span>
    </div>`).join('');
}

function selectCat(id) {
  selectedCatId = id;
  renderCatChips();
}

function renderEntries() {
  const entries = getEntries();
  const el = document.getElementById('entryList');
  if (!el) return;
  if (!entries.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div>Noch keine Ausgaben diesen Monat.<br>Trag deine erste Ausgabe oben ein!</div>';
    return;
  }
  const catMap = {};
  state.categories.forEach(c => catMap[c.id] = c);
  const sorted = entries.map((e,i) => ({...e, origIdx: i})).sort((a,b) => b.date.localeCompare(a.date));
  el.innerHTML = sorted.map(e => {
    const cat = catMap[e.catId] || { emoji: '📋', name: e.catId };
    const d = new Date(e.date + 'T00:00:00');
    const dateStr = d.toLocaleDateString('de-AT', { day:'2-digit', month:'2-digit' });
    return `<div class="entry-item">
      <div class="entry-icon">${cat.emoji}</div>
      <div class="entry-left">
        <div class="entry-desc">${esc(e.description)}</div>
        <div class="entry-meta">${dateStr} · ${esc(cat.name)}</div>
      </div>
      <span class="entry-amount">−${fmt(e.amount)}</span>
      <button class="del-btn" onclick="deleteEntry(${e.origIdx})">×</button>
    </div>`;
  }).join('');
}

function renderFixkosten() {
  const el = document.getElementById('fixkostenList');
  if (!el) return;
  if (!state.fixkosten.length) {
    el.innerHTML = '<p class="no-data">Noch keine Fixkosten. Füge welche hinzu.</p>';
    return;
  }
  el.innerHTML = state.fixkosten.map((f,i) => `
    <div class="fix-item">
      <div class="fix-left">
        <div class="fix-icon">${f.emoji||'📦'}</div>
        <span class="fix-name">${esc(f.name)}</span>
      </div>
      <div class="fix-right">
        <span class="fix-amount">${fmt(f.amount)}</span>
        <button class="del-btn" onclick="deleteFix(${i})">×</button>
      </div>
    </div>`).join('');
}

function renderCatList() {
  const el = document.getElementById('catList');
  if (!el) return;
  el.innerHTML = state.categories.map((c,i) => `
    <div class="cat-item">
      <div class="cat-left">
        <div class="cat-badge">${c.emoji}</div>
        <div>
          <div class="cat-name">${esc(c.name)}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:1px;">Budget: ${c.budget > 0 ? fmt(c.budget) + '/Monat' : 'kein Limit'}</div>
        </div>
      </div>
      <button class="del-btn" onclick="deleteCat(${i})">×</button>
    </div>`).join('');
}

function applySettings() {
  const el = document.getElementById('setGehalt');
  if (el) el.value = state.settings.gehalt || '';
}

function saveSettings() {
  state.settings.gehalt = parseFloat(document.getElementById('setGehalt').value) || 0;
  save(); toast('Gespeichert ✓'); renderOverview();
}

function addEntry() {
  const desc = document.getElementById('entryDesc').value.trim();
  const amount = parseFloat(document.getElementById('entryAmount').value);
  const date = document.getElementById('entryDate').value;
  if (!desc) { toast('Bitte Beschreibung eingeben.'); return; }
  if (!amount || amount <= 0) { toast('Bitte gültigen Betrag eingeben.'); return; }
  if (!date) { toast('Bitte Datum wählen.'); return; }
  if (!selectedCatId) { toast('Bitte Kategorie auswählen.'); return; }
  const key = monthKey();
  if (!state.entries[key]) state.entries[key] = [];
  state.entries[key].push({ description: desc, amount, catId: selectedCatId, date });
  document.getElementById('entryDesc').value = '';
  document.getElementById('entryAmount').value = '';
  save(); toast('Ausgabe eingetragen ✓');
  renderEntries(); renderOverview();
}

function deleteEntry(idx) {
  if (!confirm('Eintrag löschen?')) return;
  state.entries[monthKey()].splice(idx, 1);
  save(); renderEntries(); renderOverview();
}

// Emoji grids
function buildEmojiGrid(containerId, list, selected, onSelect) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = list.map(e => `
    <button class="emoji-btn ${selected === e ? 'selected' : ''}" onclick="(${onSelect.toString()})('${e}')">${e}</button>`
  ).join('');
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function openCatModal() {
  selectedCatEmoji = '🛒';
  document.getElementById('catName').value = '';
  document.getElementById('catBudget').value = '';
  buildEmojiGrid('catEmojiGrid', EMOJIS_CAT, selectedCatEmoji, selectCatEmoji);
  openModal('catModal');
}

function selectCatEmoji(e) {
  selectedCatEmoji = e;
  buildEmojiGrid('catEmojiGrid', EMOJIS_CAT, selectedCatEmoji, selectCatEmoji);
}

function addCategory() {
  const name = document.getElementById('catName').value.trim();
  const budget = parseFloat(document.getElementById('catBudget').value) || 0;
  if (!name) { toast('Bitte einen Namen eingeben.'); return; }
  const id = 'cat_' + Date.now();
  state.categories.push({ id, name, emoji: selectedCatEmoji, budget });
  save(); closeModal('catModal');
  renderCatList(); renderCatChips(); renderOverview();
  toast('Kategorie erstellt ✓');
}

function deleteCat(idx) {
  if (!confirm('Kategorie löschen?')) return;
  state.categories.splice(idx, 1);
  if (selectedCatId === state.categories[idx]?.id) selectedCatId = state.categories[0]?.id || null;
  save(); renderCatList(); renderCatChips(); renderOverview();
}

function openFixModalFn() {
  selectedFixEmoji = '🏠';
  document.getElementById('fixName').value = '';
  document.getElementById('fixAmount').value = '';
  buildEmojiGrid('fixEmojiGrid', EMOJIS_FIX, selectedFixEmoji, selectFixEmoji);
  openModal('fixModal');
}
// Patch the button
document.addEventListener('DOMContentLoaded', () => {
  document.querySelector('[onclick="openModal(\'fixModal\')"]').setAttribute('onclick', 'openFixModalFn()');
});

function selectFixEmoji(e) {
  selectedFixEmoji = e;
  buildEmojiGrid('fixEmojiGrid', EMOJIS_FIX, selectedFixEmoji, selectFixEmoji);
}

function addFixkosten() {
  const name = document.getElementById('fixName').value.trim();
  const amount = parseFloat(document.getElementById('fixAmount').value);
  if (!name || !amount || amount <= 0) { toast('Bitte Name und Betrag eingeben.'); return; }
  state.fixkosten.push({ name, amount, emoji: selectedFixEmoji });
  save(); closeModal('fixModal');
  renderFixkosten(); renderOverview(); toast('Fixkosten hinzugefügt ✓');
}

function deleteFix(idx) {
  if (!confirm('Fixkosten löschen?')) return;
  state.fixkosten.splice(idx, 1);
  save(); renderFixkosten(); renderOverview();
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

load();
</script>
</body>
</html>
